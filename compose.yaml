services:
  redis:
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
  web:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  worker:
    build: .
    container_name: celery_worker
    depends_on: 
      - redis
    command: ["celery", "-A", "tasks", "worker", "--loglevel=INFO"]