services:
  redis:
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
  web:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: ["uvicorn", "app.main:client_api", "--host", "0.0.0.0", "--port", "8000"]
  worker:
    build: .
    container_name: celery_worker
    env_file:
      - .env
    depends_on: 
      - redis
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO"]